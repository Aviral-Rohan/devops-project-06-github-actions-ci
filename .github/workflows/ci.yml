name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8

      - name: Test (pytest)
        run: pytest -v --junitxml=reports/junit-python-${{ matrix.python-version }}.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-test-report-python-${{ matrix.python-version }}
          path: api/reports/

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (node --test)
        run: |
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/junit-frontend.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-test-report
          path: frontend/reports/